services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: candidatures
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/candidatures
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db

volumes:
  pgdata:
